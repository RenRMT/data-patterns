---
layout: default
---
<article class="page">
  {% if page.guide %}
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="{{ '/' | relative_url }}">Home</a> <span>/</span>
    <a href="{{ '/guides/' | relative_url }}">Guides</a>
  </nav>
  {% endif %}
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
